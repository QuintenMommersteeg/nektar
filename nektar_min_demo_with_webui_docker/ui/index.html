<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nektar Minimal Demo — DB → AI → Antwoord</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0f172a; --card:#0b1220; --text:#e5e7eb; --muted:#9aa4b2;
      --line:#1f2937; --accent:#22c55e; --accent-2:#60a5fa; --danger:#ef4444;
      --bubble-you:#111827; --bubble-ai:#0e1a11; --ring:#16a34a33;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,Segoe UI,Roboto,Arial;}
    .wrap{display:flex;flex-direction:column;min-height:100vh}
    header{
      position:sticky;top:0;z-index:50;background:rgba(11,18,32,.9);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line)
    }
    .container{max-width:900px;margin:0 auto;padding:16px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{
      width:28px;height:28px;display:grid;place-items:center;
      border-radius:10px;background:linear-gradient(135deg,var(--accent),#0ea5e9);
      color:#062a1a;font-weight:700
    }
    .title{font-weight:600;letter-spacing:.2px}
    main{flex:1}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden
    }
    .tips{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
    .chat{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:50vh}
    .row{display:flex;gap:12px;align-items:flex-end}
    .row.you{justify-content:flex-start}
    .row.ai{justify-content:flex-end}
    .bubble{
      max-width:70%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word
    }
    .you .bubble{background:var(--bubble-you)}
    .ai .bubble{background:var(--bubble-ai);border-color:#11381b}
    .meta{
      display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0 0;font-size:12px;color:var(--muted)
    }
    .pill{padding:2px 8px;border:1px solid var(--line);border-radius:999px}
    .pill.intent{border-color:#14532d;color:#a7f3d0}
    .pill.params{border-color:#1e40af;color:#bfdbfe}
    .inputbar{
      position:sticky;bottom:0;background:rgba(11,18,32,.98);border-top:1px solid var(--line)
    }
    .input-inner{display:flex;gap:10px;align-items:center}
    .field{
      position:relative;flex:1
    }
    input[type="text"]{
      width:100%;padding:14px 44px 14px 14px;border-radius:12px;border:1px solid var(--line);
      background:var(--card);color:var(--text);outline:none
    }
    input[type="text"]:focus{box-shadow:0 0 0 3px var(--ring);border-color:#14532d}
    .send{
      position:absolute;right:6px;top:6px;border-radius:10px;border:1px solid #1f2937;
      background:linear-gradient(180deg,#22c55e,#16a34a);color:#052e1b;font-weight:700;
      padding:8px 10px;cursor:pointer
    }
    .send:disabled{opacity:.6;cursor:not-allowed}
    .endpoint{margin-top:6px;color:var(--muted);font-size:12px}
    .status{color:var(--muted);font-size:12px;margin-left:auto}
    .err{color:#fecaca}
    .kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;font-size:12px;color:var(--muted)}
    .row.loading .bubble{opacity:.75;background:repeating-linear-gradient(90deg,#0d1c10,#0d1c10 8px,#0f2214 8px,#0f2214 16px)}
    @media (max-width:680px){
      .bubble{max-width:85%}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="container" style="display:flex;align-items:center;gap:14px;">
      <div class="brand">
        <div class="logo">N</div>
        <div class="title">Nektar Minimal Demo</div>
      </div>
      <div class="status" id="status">Klaar</div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="tips">
        Voorbeelden: <em>“Wat staat er op 28/10 gepland?”</em>,
        <em>“Welke werkorders zijn er voor Jan Jansen?”</em>,
        <em>“Welke afspraken zijn er morgen?”</em>.
      </div>

      <div class="chat" id="chat"></div>

      <div class="inputbar">
        <div class="container">
          <div class="input-inner">
            <div class="field" style="flex:1;">
              <input id="q" type="text" autocomplete="off" placeholder="Stel je vraag… (Enter om te verzenden)" />
              <button id="send" class="send">Verstuur</button>
            </div>
            <span class="kbd">Enter</span>
          </div>
          <div class="endpoint">API endpoint: <code id="endpoint"></code></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const endpoint = window.location.origin + "/ask";
document.getElementById("endpoint").textContent = endpoint;

const chat = document.getElementById("chat");
const q = document.getElementById("q");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");

function addRow(text, who="you", meta=null, isLoading=false){
  const row = document.createElement("div");
  row.className = `row ${who}` + (isLoading ? " loading" : "");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);

  if(meta){
    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    if(meta.intent){
      const p1 = document.createElement("span");
      p1.className = "pill intent";
      p1.textContent = `intent: ${meta.intent}`;
      metaEl.appendChild(p1);
    }
    if(meta.params){
      const p2 = document.createElement("span");
      p2.className = "pill params";
      const txt = JSON.stringify(meta.params);
      p2.textContent = `params: ${txt.length>80 ? txt.slice(0,77)+"…" : txt}`;
      metaEl.appendChild(p2);
    }
    row.appendChild(metaEl);
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

async function ask(){
  const question = q.value.trim();
  if(!question) return;
  addRow(question, "you");
  q.value = ""; q.focus();
  send.disabled = true;
  statusEl.textContent = "Bezig…";
  const loader = addRow("Denken… DB aanroepen…", "ai", null, true);

  try{
    const res = await fetch(endpoint, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    loader.remove();
    addRow(data.answer || "(geen antwoord)", "ai", {intent:data.intent, params:data.params});
  }catch(e){
    loader.remove();
    addRow("Fout bij ophalen: " + (e.message||e), "ai");
    const err = document.createElement("div");
    err.className = "meta err";
    err.textContent = "Er ging iets mis — controleer of de server draait en Ollama beschikbaar is.";
    chat.appendChild(err);
  }finally{
    send.disabled = false;
    statusEl.textContent = "Klaar";
    chat.scrollTop = chat.scrollHeight;
  }
}

send.addEventListener("click", ask);
q.addEventListener("keydown", e => {
  if(e.key === "Enter"){ ask(); }
});
</script>
</body>
</html>
